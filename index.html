        // --- STATE MANAGEMENT & SMART CACHE BUSTING ---
        let state = {};

        function loadState() {
            const cachedVersion = localStorage.getItem('dm_build_version');
            const injectedEl = document.getElementById('app-state-store');
            let injectedState = null;
            
            if (injectedEl && injectedEl.innerText.trim() !== 'null') {
                try { injectedState = JSON.parse(injectedEl.innerText); } catch (e) {}
            }

            // Jika versi build di GitHub berbeda dengan cache lokal browser, reset cache lokal agar data terbaru dari GitHub langsung dimuat
            if (cachedVersion !== APP_BUILD_VERSION) {
                localStorage.removeItem('dm_settings');
                localStorage.removeItem('dm_products');
                localStorage.removeItem('dm_testimonials');
                localStorage.removeItem('dm_faqs');
                localStorage.removeItem('dm_paymentProofs');
                localStorage.removeItem('dm_banners');
                localStorage.removeItem('dm_live_sales');
                localStorage.removeItem('dm_announcements');
                localStorage.setItem('dm_build_version', APP_BUILD_VERSION);
            }

            const localSettings = JSON.parse(localStorage.getItem('dm_settings'));
            const localProducts = JSON.parse(localStorage.getItem('dm_products'));
            const localTestimonials = JSON.parse(localStorage.getItem('dm_testimonials'));
            const localFaqs = JSON.parse(localStorage.getItem('dm_faqs'));
            const localPaymentProofs = JSON.parse(localStorage.getItem('dm_paymentProofs'));
            const localBanners = JSON.parse(localStorage.getItem('dm_banners'));
            const localLiveSales = JSON.parse(localStorage.getItem('dm_live_sales'));
            const localAnnouncements = JSON.parse(localStorage.getItem('dm_announcements'));

            if (injectedState && injectedState.settings) {
                state = injectedState;
            } else {
                state = {
                    settings: localSettings || DEFAULT_SETTINGS,
                    products: localProducts || DEFAULT_PRODUCTS,
                    testimonials: localTestimonials || DEFAULT_TESTIMONIALS,
                    faqs: localFaqs || DEFAULT_FAQS,
                    paymentProofs: localPaymentProofs || DEFAULT_PAYMENT_PROOFS,
                    banners: localBanners || DEFAULT_BANNERS,
                    liveSales: localLiveSales || DEFAULT_LIVE_SALES,
                    announcements: localAnnouncements || DEFAULT_ANNOUNCEMENTS
                };
            }
            saveState();
        }

        function saveState() {
            try {
                localStorage.setItem('dm_settings', JSON.stringify(state.settings));
                localStorage.setItem('dm_products', JSON.stringify(state.products));
                localStorage.setItem('dm_testimonials', JSON.stringify(state.testimonials));
                localStorage.setItem('dm_faqs', JSON.stringify(state.faqs));
                localStorage.setItem('dm_paymentProofs', JSON.stringify(state.paymentProofs));
                localStorage.setItem('dm_banners', JSON.stringify(state.banners));
                localStorage.setItem('dm_live_sales', JSON.stringify(state.liveSales));
                localStorage.setItem('dm_announcements', JSON.stringify(state.announcements));
                localStorage.setItem('dm_build_version', APP_BUILD_VERSION);
            } catch (e) {
                console.warn("Storage quota exceeded", e);
            }
        }

        async function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        // --- ANNOUNCEMENT AUTO SLIDE ---
        function initAnnouncementSlider() {
            if(announcementTimer) clearInterval(announcementTimer);
            updateAnnouncementBar();
            announcementTimer = setInterval(() => {
                if(state.announcements && state.announcements.length > 1) {
                    announcementIndex = (announcementIndex + 1) % state.announcements.length;
                    updateAnnouncementBar();
                }
            }, 3500);
        }

        function updateAnnouncementBar() {
            const el = document.getElementById('announcement-text');
            if(el && state.announcements && state.announcements.length > 0) {
                el.style.opacity = 0;
                setTimeout(() => {
                    el.textContent = state.announcements[announcementIndex];
                    el.style.opacity = 1;
                }, 250);
            }
        }

        // --- RENDER CATEGORIES ---

            const categoryMap = {};
            state.products.forEach(p => {

                const subCat = p.subCategory || 'Umum';
                if (!categoryMap[cat][subCat]) categoryMap[cat][subCat] = new Set();
                if (p.subSubCategory) categoryMap[cat][subCat].add(p.subSubCategory);
            });

            const categories = Object.keys(categoryMap);

            return `
                <section class="max-w-7xl mx-auto px-4 sm:px-6 md:px-12 pt-8 pb-6" id="katalog">

                            Semua Produk (${state.products.length})
                        </button>

                        ${categories.map(cat => {
                            const subCatsObj = categoryMap[cat];
                            const isMainActive = selectedCategory === cat || Object.keys(subCatsObj).some(sub => selectedCategory === sub || Array.from(subCatsObj[sub]).includes(selectedCategory));
                            const isExpanded = openDropdownCategory === cat;

                            return `
                                <div class="flex items-center rounded-2xl shadow-sm border flex-shrink-0 ${isMainActive ? 'bg-primary text-white border-transparent' : 'bg-white hover:bg-slate-50 text-slate-700 border-slate-100'}" style="${isMainActive ? 'background-color: ' + state.settings.iconColor : ''}">

                                        ${cat}
                                    </button>
                                    <button onclick="toggleCategoryExpand('${cat}')" class="px-2.5 py-2.5 border-l ${isMainActive ? 'border-white/20 hover:bg-white/10' : 'border-slate-100 hover:bg-slate-100'} transition-colors flex items-center justify-center">
                                        <i class="ph ph-caret-down text-xs transition-transform duration-300 ${isExpanded ? 'rotate-180' : ''}"></i>
                                    </button>
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <!-- Expanded Inline Subcategories Panel -->
                    ${openDropdownCategory && categoryMap[openDropdownCategory] ? `
                        <div class="bg-white rounded-3xl p-5 sm:p-6 shadow-sm border border-slate-100 mt-4 animate-fade-in space-y-4">
                            <div class="flex items-center justify-between border-b pb-3 border-slate-100">

                                <button onclick="selectedCategory = '${openDropdownCategory}'; render();" class="text-xs font-bold text-primary hover:underline" style="color: ${state.settings.iconColor}">Lihat Semua di ${openDropdownCategory}</button>
                            </div>

                            <div class="space-y-3">
                                ${Object.keys(categoryMap[openDropdownCategory]).map(subCat => {
                                    const subSubSet = categoryMap[openDropdownCategory][subCat];
                                    const subSubList = Array.from(subSubSet);
                                    const isSubActive = selectedCategory === subCat;

                                    return `
                                        <div class="p-3 rounded-2xl bg-slate-50 border border-slate-100/80">
                                            <div class="flex flex-wrap items-center gap-2 mb-2">
                                                <button onclick="selectedCategory = '${subCat}'; render();" class="px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all ${isSubActive ? 'bg-primary text-white shadow-sm' : 'bg-white text-slate-800 border border-slate-200 hover:bg-slate-100'}" style="${isSubActive ? 'background-color: ' + state.settings.iconColor : ''}">
                                                    📁 ${subCat}
                                                </button>
                                            </div>
                                            ${subSubList.length > 0 ? `
                                                <div class="flex flex-wrap items-center gap-1.5 pl-4 pt-1 border-l-2 border-indigo-200">

                                                            ↳ ${subSub}
                                                        </button>
                                                    `).join('')}
                                                </div>
                                            ` : ''}
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>

        window.toggleCategoryExpand = function(cat) {

                openDropdownCategory = cat;

        // --- RENDER PRODUCTS IN SEPARATE CARD CONTAINER ---
        function renderProducts() {

                const matchSearch = !searchQuery || p.title.toLowerCase().includes(searchQuery.toLowerCase()) || (p.tags||'').toLowerCase().includes(searchQuery.toLowerCase()) || (p.subCategory||'').toLowerCase().includes(searchQuery.toLowerCase()) || (p.subSubCategory||'').toLowerCase().includes(searchQuery.toLowerCase());
                return matchCat && matchSearch;

            return `

                        ${filtered.length === 0 ? `

                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">

                                    return `

                                                <div class="relative rounded-2xl overflow-hidden aspect-[16/9] mb-3 bg-slate-100 cursor-pointer w-full" onclick="navigate('product', '${p.id}')">
                                                    <img src="${p.cover}" alt="${p.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" onerror="this.src='https://placehold.co/600x400/e2e8f0/64748b?text=DocMarket'">
                                                    <span class="absolute top-3 left-3 px-2.5 py-1 bg-white/90 backdrop-blur-md rounded-lg text-[10px] font-bold uppercase text-slate-800 tracking-wider shadow-sm">
                                                        .${p.format}

                                                <div class="flex items-center justify-between mb-1">
                                                    <span class="text-[10px] font-bold text-primary uppercase tracking-wider" style="color: ${state.settings.iconColor}">${p.category}</span>

                                <input type="text" id="loginEmail" required class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-primary font-medium">
                            </div>
                            <div>

                            </button>

            `;
        }

        function handleLogin(e) {
            if(e) e.preventDefault();
            const emailEl = document.getElementById('loginEmail');
            const passEl = document.getElementById('loginPass');
            if(!emailEl || !passEl) return;
            const email = emailEl.value;
            const pass = passEl.value;
            if (email === state.settings.adminEmail && pass === state.settings.adminPass) {
                isAdminLoggedIn = true;
                localStorage.setItem('dm_is_admin', 'true');
                navigate('home');
            } else {
                showAlert("Login Gagal", "Email atau password yang Anda masukkan salah.");
            }
        }

        function logoutAdmin() {
            isAdminLoggedIn = false;
            localStorage.removeItem('dm_is_admin');
            navigate('home');
        }

            state.settings.siteName = getVal('set-siteName', state.settings.siteName);

            state.settings.themeColor = getVal('set-themeColor', state.settings.themeColor);

            state.settings.aboutTitle = getVal('set-aboutTitle', state.settings.aboutTitle);

            state.settings.aboutContact = getVal('set-aboutContact', state.settings.aboutContact);

            const logoInput = document.getElementById('set-logo');
            if (logoInput && logoInput.files[0]) {
                state.settings.logoUrl = await toBase64(logoInput.files[0]);

            const aboutPhotoInput = document.getElementById('set-aboutPhotoFile');

            saveState();
            showAlert("Berhasil", "Pengaturan berhasil disimpan!");

                            </div>

                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1.5">Unggah Gambar Preview Tambahan (Slider)</label>
                                <input type="file" id="prod-previewsFile" accept="image/*" multiple class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-indigo-50 file:text-primary">
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1.5">Deskripsi Produk</label>
                                <textarea id="prod-desc" required rows="4" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm">${p.desc}</textarea>
                            </div>

                            <div class="flex gap-4 pt-4">
                                <button type="button" onclick="navigate('home')" class="w-1/3 py-4 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-2xl font-bold text-sm">Batal</button>
                                <button type="submit" class="w-2/3 py-4 bg-primary text-white rounded-2xl font-bold text-sm shadow-xl shadow-indigo-200 hover:bg-secondary transition-all" style="background-color: ${state.settings.iconColor}">Simpan Produk</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        async function handleSaveProduct(e, prodId) {
            e.preventDefault();
            const title = document.getElementById('prod-title').value;
            const category = document.getElementById('prod-category').value;
            const subCategory = document.getElementById('prod-subCategory').value;
            const subSubCategory = document.getElementById('prod-subSubCategory').value;
            const format = document.getElementById('prod-format').value.trim().toLowerCase();
            const pagesCount = document.getElementById('prod-pagesCount').value;
            const compatibility = document.getElementById('prod-compatibility').value;
            const price = parseFloat(document.getElementById('prod-price').value) || 0;
            const priceDiscount = parseFloat(document.getElementById('prod-priceDiscount').value) || 0;
            const tags = document.getElementById('prod-tags').value;
            const desc = document.getElementById('prod-desc').value;

            let cover = document.getElementById('prod-coverExisting').value || 'https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?auto=format&fit=crop&w=600&q=80';
            const coverInput = document.getElementById('prod-coverFile');
            if (coverInput && coverInput.files[0]) {
                cover = await toBase64(coverInput.files[0]);
            }

            let previews = [];
            const prevInput = document.getElementById('prod-previewsFile');
            if (prevInput && prevInput.files.length > 0) {
                for (let file of prevInput.files) {
                    const b64 = await toBase64(file);
                    previews.push(b64);
                }
            } else {
                const existingProd = state.products.find(item => item.id === prodId);
                previews = existingProd ? existingProd.previews : [cover];
            }

            if (prodId) {
                const idx = state.products.findIndex(item => item.id === prodId);
                if (idx !== -1) {
                    state.products[idx] = { ...state.products[idx], title, category, subCategory, subSubCategory, format, pagesCount, compatibility, price, priceDiscount, tags, cover, previews, desc };
                }
            } else {
                const newProd = {
                    id: 'prod-' + Date.now(),
                    title, category, subCategory, subSubCategory, format, pagesCount, compatibility, price, priceDiscount, tags, cover, previews, desc
                };
                state.products.unshift(newProd);
            }

            saveState();
            showAlert("Berhasil", "Produk berhasil disimpan!");
            navigate('home');
        }

        function deleteProduct(id) {
            state.products = state.products.filter(item => item.id !== id);
            saveState();
            showAlert("Berhasil", "Produk telah dihapus.");
            navigate('home');
        }

        function downloadBackup() {
            // Synchronize current state to embedded script tag
            const stateStoreEl = document.getElementById('app-state-store');
            if (stateStoreEl) {
                stateStoreEl.textContent = JSON.stringify(state);
            }

            // Also update localStorage to ensure everything is fresh
            saveState();

            // Clone document element to generate the most up-to-date DOM snapshot with state embedded
            const cloneDoc = document.documentElement.outerHTML;
            const htmlContent = "<!DOCTYPE html>\n" + cloneDoc;

            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'index.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showAlert("Backup Berhasil", "File index.html terbaru beserta seluruh produk dan perubahan data telah berhasil diunduh. Silakan unggah file ini ke server/perangkat lain.");
        }

        // --- RENDER MAIN FUNCTION ---
        function render() {
            const root = document.getElementById('root');
            if(!root) return;

            // If user is currently on the login view and focused inside login inputs, do not re-render to preserve typing state
            if (currentView === 'login') {
                const activeEl = document.activeElement;
                if (activeEl && (activeEl.id === 'loginEmail' || activeEl.id === 'loginPass')) {
                    return;
                }
            }

            // Preserve active element and cursor position if user is typing
            const activeEl = document.activeElement;
            const activeId = activeEl ? activeEl.id : null;
            const selectionStart = activeEl && typeof activeEl.selectionStart === 'number' ? activeEl.selectionStart : null;
            const selectionEnd = activeEl && typeof activeEl.selectionEnd === 'number' ? activeEl.selectionEnd : null;

            if (currentView === 'home') {
                root.innerHTML = `
                    ${renderHeader(false)}
                    <main class="min-h-screen pt-0">
                        ${renderAnnouncementBar()}
                        ${renderHero()}
                        ${renderBanners()}
                        ${renderCategories()}
                        ${renderProducts()}
                        ${renderTestimonials()}
                        ${renderPaymentProofs()}
                        ${renderAboutSnippet()}
                        ${renderFAQ()}
                    </main>
                    ${renderFooter()}
                `;
            } else if (currentView === 'product') {
                root.innerHTML = `
                    ${renderHeader(true)}
                    <main class="min-h-screen pt-0">
                        ${renderAnnouncementBar()}
                        ${renderProductDetailView(currentProductId)}
                    </main>
                    ${renderFooter()}
                `;
            } else if (currentView === 'about') {
                root.innerHTML = `
                    ${renderHeader(true)}
                    <main class="min-h-screen pt-0">
                        ${renderAnnouncementBar()}
                        ${renderAboutView()}
                    </main>
                    ${renderFooter()}
                `;
            } else if (currentView === 'login') {
                 root.innerHTML = `
                    ${renderHeader(true)}
                    <main class="min-h-screen pt-0">
                        ${renderAnnouncementBar()}
                        ${renderLoginFull()}
                    </main>
                `;
            } else if (currentView === 'settings') {
                 root.innerHTML = `
                    ${renderHeader(true)}
                    <main class="min-h-screen pt-0">
                        ${renderAnnouncementBar()}
                        ${renderSettingsFull()}
                    </main>
                    ${renderFooter()}
                `;
            } else if (currentView === 'edit-product') {
                 root.innerHTML = `
                    ${renderHeader(true)}
                    <main class="min-h-screen pt-0">
                        ${renderAnnouncementData ? '' : ''}
                        ${renderEditProductFull(currentProductId)}
                    </main>
                    ${renderFooter()}
                `;
            }

            // Restore focus if it was on an input field
            if (activeId) {
                const elToFocus = document.getElementById(activeId);
                if (elToFocus && typeof elToFocus.focus === 'function') {
                    elToFocus.focus();
                    if (selectionStart !== null && selectionEnd !== null && typeof elToFocus.setSelectionRange === 'function') {
                        try {
                            elToFocus.setSelectionRange(selectionStart, selectionEnd);
                        } catch(e) {}
                    }
                }
            }
        }

        window.onload = function() {
            loadState();
            render();
            initAnnouncementSlider();
        }
    </script>
</body>
